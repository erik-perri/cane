[package]
name = "cane-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
cane-config = { path = "../config", version = "0.1.0" }
dunce = "1.0.5"
futures-util = "0.3.32"
globset = "0.4.18"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.28"
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
libc = "0.2.186"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "process", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
ulid = "3.0.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
wiremock = "0.6.5"
